# Copy to .github/workflows/ai-agent-evaluation.yml. Runs your suite on every pull request and fails the
# check when a case is worse than the baseline committed in .ai-agent-evaluation/ by more than chance explains.
name: agent regression tests
on: pull_request
jobs:
  ai-agent-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt git+https://github.com/dhruv1999/AI-Agent-Evaluation
      - run: ai-agent-evaluation run tests/agent_suite.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
