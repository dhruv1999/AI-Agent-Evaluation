# Copy to .github/workflows/model-swap.yml. Run it by hand (Actions tab, Run workflow) when you are
# thinking about a new model. The report is saved as a build artifact and shown on the run's page.
name: model swap
on:
  workflow_dispatch:
    inputs:
      candidate:
        description: "model to compare against the current one"
        required: true
jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt ai-agent-evaluation
      - run: ai-agent-evaluation compare tests/agent_suite.py --baseline-model gpt-current --candidate-model "${{ inputs.candidate }}"
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-swap-report
          path: eval-results/
