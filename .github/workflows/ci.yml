name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      # any file I/O that relies on the platform's default encoding fails the build (it breaks on Windows)
      - run: uv run python -X warn_default_encoding -W error::EncodingWarning -m pytest -q

  install-from-scratch:
    # what a new user does: pip install into a clean environment, then run the example from another folder
    runs-on: ubuntu-latest
    env:
      DEMO_SEED: "7"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m venv /tmp/env && /tmp/env/bin/pip install . pytest
      - name: compare
        run: |
          cd /tmp
          S="$GITHUB_WORKSPACE/examples/xpath_healing/suite.py"
          /tmp/env/bin/ai-agent-evaluation compare "$S" --baseline-model model-old --candidate-model model-new --seed 7
          /tmp/env/bin/ai-agent-evaluation compare "$S" --baseline-model model-old --candidate-model model-mini --seed 7 && exit 1 || test $? -eq 1
          /tmp/env/bin/ai-agent-evaluation compare "$S" --baseline-model model-old --candidate-model model-new --smoke
      - name: pytest
        run: cd /tmp && /tmp/env/bin/python -m pytest -q "$GITHUB_WORKSPACE/examples/xpath_healing"

  benchmark:
    # the numbers in the docs come from this script; make sure it still runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python benchmarks/model_swap_benchmark.py --sims 200
