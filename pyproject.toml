[project]
name = "ai-agent-evaluation"
dynamic = ["version"]
description = "Should your AI agent switch models? Compare two models on your own test cases and get pass, regressed or not enough data, with cost and speed."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Dhruv Parmar" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["ai agents", "evaluation", "evals", "model upgrade", "model comparison", "regression testing", "llm", "pytest", "ci"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/dhruv1999/AI-Agent-Evaluation"
Issues = "https://github.com/dhruv1999/AI-Agent-Evaluation/issues"

[project.scripts]
ai-agent-evaluation = "ai_agent_evaluation.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.16", "mypy>=1.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "ai_agent_evaluation/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["ai_agent_evaluation"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["*.md"]  # code in the docs is laid out for reading
line-length = 160
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
packages = ["ai_agent_evaluation"]
warn_unused_ignores = true
